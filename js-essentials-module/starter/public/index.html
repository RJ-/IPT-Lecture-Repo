<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Directory · IPT1</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1d2330; }
    h1 { color: #1f3a5f; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input, select, button { font: inherit; padding: .5rem .7rem; border-radius: 6px; border: 1px solid #aab; }
    button { cursor: pointer; background: #1f3a5f; color: #fff; border-color: #1f3a5f; }
    li { display: flex; justify-content: space-between; align-items: center; padding: .5rem 0; border-bottom: 1px solid #eee; }
    li button { background: #fff; color: #b23a3a; border-color: #e3b3b3; font-size: .85rem; padding: .25rem .6rem; }
    #status { color: #555; }
    #status.error { color: #b23a3a; }
    ul { list-style: none; padding: 0; }
  </style>
</head>
<body>
  <h1>Student Directory</h1>

  <form id="form">
    <input id="name" placeholder="Full name" required>
    <select id="section">
      <option value="2A">BSIT 2A</option>
      <option value="2B">BSIT 2B</option>
    </select>
    <button type="submit">Add student</button>
  </form>

  <p id="status">Loading…</p>
  <ul id="list"></ul>

  <script src="app.js"></script>
</body>
</html>
