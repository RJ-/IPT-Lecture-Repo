
syntax = "proto3";

package demo;

// Simple Greeter service
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc Echo (EchoRequest) returns (EchoReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

message EchoRequest {
  string text = 1;
}

message EchoReply {
  string text = 1;
  string via = 2;
}
