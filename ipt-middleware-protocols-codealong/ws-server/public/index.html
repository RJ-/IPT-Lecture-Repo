
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebSocket Demo</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
      #log { border: 1px solid #ccc; padding: 1rem; height: 200px; overflow: auto; }
      input, button { padding: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>WebSocket Demo</h1>
    <p>Open this page in two tabs. Messages will broadcast to all clients.</p>
    <div id="log"></div>
    <p>
      <input id="msg" placeholder="Type a message" />
      <button id="send">Send</button>
    </p>
    <script>
      const log = (m) => {
        const div = document.getElementById('log');
        div.innerHTML += `<div>${m}</div>`;
        div.scrollTop = div.scrollHeight;
      };
      const ws = new WebSocket(`ws://localhost:3001?apiKey=demo-key`);
      ws.onopen = () => log('✅ Connected');
      ws.onmessage = (ev) => log('📩 ' + ev.data);
      ws.onclose = () => log('❌ Disconnected');
      document.getElementById('send').onclick = () => {
        const v = document.getElementById('msg').value;
        if (v) ws.send(v);
        document.getElementById('msg').value = '';
      };
    </script>
  </body>
</html>
